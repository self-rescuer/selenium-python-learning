<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>Select 和 ActionChains 练习</title>
    <style>
        .box {
            width: 200px;
            height: 100px;
            background-color: lightblue;
            margin: 20px;
            text-align: center;
            line-height: 100px;
        }
    </style>
</head>
<body>
    <h1>Select 和 ActionChains 练习页面</h1>

    <h2>下拉框练习</h2>
    <select id="fruit">
        <option value="">请选择水果</option>
        <option value="apple">苹果</option>
        <option value="banana">香蕉</option>
        <option value="orange">橙子</option>
    </select>
    <br><br>

    <h2>鼠标悬停练习</h2>
    <div class="box" id="hover-box">鼠标悬停到这里</div>

    <h2>拖拽练习</h2>
    <div class="box" id="drag-source" draggable="true" style="background-color: lightcoral;">拖拽我</div>
    <div class="box" id="drop-target" style="background-color: lightgreen;">放到这里</div>
</body>
</html>
